name: Wiki documentation
on:
  push:
    paths:
      - 'README.md'
      - 'wiki/**'
      - 'docs/wiki-*'
      - 'scripts/verify-wiki.py'
      - 'src/main/**'
      - 'gradle.properties'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'wiki/**'
      - 'docs/wiki-*'
      - 'scripts/verify-wiki.py'
      - 'src/main/**'
      - 'gradle.properties'
      - '.github/workflows/docs.yml'
permissions:
  contents: read
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check translations, links and feature screenshots
        run: python3 scripts/verify-wiki.py
